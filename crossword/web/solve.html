<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crossword solver</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ed;color:#253c35;font:15px system-ui}header{padding:24px 4vw;border-bottom:1px solid #d7ded6;display:flex;justify-content:space-between;align-items:center}h1,h2{font-family:Georgia;margin:8px 0 16px}h1{font-size:32px}h2{font-size:22px}a{color:#285c49}main{padding:28px 4vw;display:grid;grid-template-columns:280px minmax(0,1fr);gap:24px}aside,section{background:#fffef9;border:1px solid #d7ded6;border-radius:12px;padding:22px}.muted{color:#65796f;line-height:1.5}label{display:block;margin:14px 0 6px}input,button{font:inherit;padding:10px;border:1px solid #bac9be;border-radius:6px}input{width:100%}button{cursor:pointer;background:#e9eee7;color:#253c35}button:disabled{opacity:.45;cursor:default}.primary{background:#285c49;color:white}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.scroll{overflow:auto;padding:4px}#grid{display:grid;gap:1px;width:100%;background:#b8c5bc;border:1px solid #b8c5bc}.cell{width:100%;aspect-ratio:1;display:grid;place-items:center;position:relative;background:#fffef9;text-align:center;line-height:normal;font-weight:600}.cell.block{background:#344c41}.cell.active{background:#ffe1a8}.cell small{position:absolute;left:2px;top:1px;font-size:8px;line-height:9px;font-weight:400}#status{min-height:48px;line-height:1.5}#status.error{color:#a33123}#clues{display:grid;grid-template-columns:1fr 1fr;gap:20px}.clue{padding:10px 0;border-bottom:1px solid #e3e7df}.clue.active{background:#fff0d5}.candidate{font-size:12px;color:#65796f;margin-top:5px}#log{max-height:180px;overflow:auto;font-size:13px;line-height:1.6;padding-left:22px}@media(max-width:800px){main{grid-template-columns:1fr;padding:16px}#clues{grid-template-columns:1fr}header{padding:18px}}
.header-actions{display:flex;align-items:center;justify-content:flex-end;gap:20px;flex-wrap:wrap}.language-picker{margin:0;font-size:12px;color:#65796f}.language-picker select{display:block;width:auto;max-width:100%;margin-top:5px;padding:9px 12px;border:1px solid #bac9be;border-radius:6px;background:#fffef9;color:#253c35;font:15px system-ui}header{gap:20px;flex-wrap:wrap}</style>
<header><h1>Crossword solver</h1><div class="header-actions"><a href="/">Construction editor →</a><label class="language-picker" for="language">Puzzle language<select id="language"><option value="en">English</option><option value="hy">Հայերեն (Armenian)</option></select></label></div></header>
<main><aside><h2>New puzzle</h2><p class="muted">Watch dictionary candidates and crossing letters build a solution.</p>
<form id="generate-form"><label for="word-count">Number of words</label><input id="word-count" type="number" min="1" max="100" value="15" required>
<label for="seed">Seed (optional)</label><input id="seed" type="number" min="0" max="4294967295" placeholder="Random">
<div class="controls"><button id="generate" class="primary">Generate puzzle</button></div></form>
<div class="controls"><button id="solve" disabled>Solve</button><button id="step" disabled>Step</button><button id="pause" disabled>Pause</button><button id="reset" disabled>Reset</button><button id="check" disabled>Check answers</button></div>
<label for="speed">Delay between steps (ms)</label><input id="speed" type="number" min="0" max="2000" value="80">
<p id="status" role="status" aria-live="polite">Generate a puzzle to begin.</p><p id="progress" class="muted"></p>
<h2>Search activity</h2><ol id="log" aria-label="Recent solver steps"></ol>
</aside><section><h2>Your solving grid</h2><p id="dimensions" class="muted">No puzzle loaded.</p><div class="scroll"><div id="grid" role="group" aria-label="Crossword grid"></div></div>
<h2 style="margin-top:24px">Clues</h2><div id="clues"></div></section></main>
<script type="module" src="/solver-ui.mjs"></script>
</html>
